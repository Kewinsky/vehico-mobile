name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --ci --runInBand

      - name: Run coverage
        run: npm run test:coverage -- --ci --runInBand

  deploy-functions:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge functions
        run: |
          supabase functions deploy revenuecat-webhook --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy retention-cleanup --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy delete-account --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy generate-marketplace-post --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy vehicle-chat --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy service-invoice-import --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
          supabase functions deploy fuel-receipt-import --remote=${{ secrets.SUPABASE_PROJECT_REF }} --yes
