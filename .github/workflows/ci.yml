name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --ci --runInBand

      - name: Run coverage
        run: npm run test:coverage -- --ci --runInBand

  deploy-functions:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions (prod)
        if: github.ref == 'refs/heads/main'
        environment: PROD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy revenuecat-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy retention-cleanup --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy delete-account --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-marketplace-post --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy edge functions (dev)
        if: github.ref == 'refs/heads/develop'
        environment: DEV
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy revenuecat-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy retention-cleanup --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy delete-account --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-marketplace-post --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

